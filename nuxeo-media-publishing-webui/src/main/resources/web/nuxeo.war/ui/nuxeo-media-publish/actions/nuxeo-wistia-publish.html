<link rel="import" href="nuxeo-media-publish-behavior.html">

<script src="//fast.wistia.com/assets/external/api.js" async></script>

<!--
`nuxeo-wistia-publish`
@group Nuxeo UI
@element nuxeo-wistia-publish
-->
<dom-module id="nuxeo-wistia-publish">
    <template>
        <style include="nuxeo-action-button-styles nuxeo-styles iron-flex iron-flex-alignment">
            .content {
                @apply --layout-vertical;
            }

            #progress {
                margin: 0px;
                margin-top: 16px;
                padding: 0px;
                width: 100%;
            }

            .buttons {
                margin-top: 0px;
            }

            *[role='widget'] {
                display: block;
                margin-bottom: 16px;
            }

            .logo {
                height: 6rem;
                display: block;
                margin-right: 16px;
            }

            iframe {
                width: 100%;
                aspect-ratio: 1.666;
            }
        </style>

        <nuxeo-resource id="oauth2"></nuxeo-resource>

        <nuxeo-operation id="publishOp" op="MediaPublish" schemas="*" async></nuxeo-operation>
        <nuxeo-operation id="unpublishOp" op="MediaUnpublish" schemas="*" async></nuxeo-operation>

        <template is="dom-if" if="[[isAvailable]]">
            <div class="action" on-tap="_toggleDialog">
                <paper-icon-button id="bt" src="[[icon]]"></paper-icon-button>
                <span class="label" hidden$="[[!showLabel]]">[[i18n(label)]]</span>
            </div>
            <paper-tooltip for="bt">[[i18n(label)]]</paper-tooltip>
        </template>

        <nuxeo-dialog id="dialog" on-iron-overlay-closed="_dialogClosed" with-backdrop>
            <div class="layout horizontal">
                <iron-icon class="logo" src="[[icon]]"></iron-icon>
                <h2>[[i18n(label)]]</h2>
            </div>
            <div class="content">
                <template is="dom-if" if="[[isUserAuthorized]]">
                    <template is="dom-if" if="[[!isWistiaPublish(document)]]">
                        <nuxeo-input role="widget" label="[[i18n('label.action.wistia.name')]]"
                            value="{{options.name}}"></nuxeo-input>
                        <nuxeo-textarea role="widget" label="[[i18n('label.action.wistia.description')]]"
                            value="{{options.description}}"></nuxeo-textarea>
                        <nuxeo-select role="widget" label="[[i18n('label.action.wistia.project')]]"
                            options="[[projects]]" selected="{{options.project_id}}"></nuxeo-select>
                    </template>
                    <template is="dom-if" if="[[isWistiaPublish(document)]]">
                        <div class="wistia_responsive_padding" style="padding:56.25% 0 0 0;position:relative;">
                            <div class="wistia_responsive_wrapper"
                                style="height:100%;left:0;position:absolute;top:0;width:100%;"><iframe
                                    src="https://fast.wistia.net/embed/iframe/[[_getWistiaMediaId(document)]]?web_component=true&seo=false"
                                    title="Earth Video" allow="autoplay; fullscreen" allowtransparency="true"
                                    frameborder="0" scrolling="no" class="wistia_embed" name="wistia_embed" width="100%"
                                    height="100%"></iframe></div>
                        </div>
                        <script src="https://fast.wistia.net/player.js" async></script>
                    </template>
                </template>
                <template is="dom-if" if="[[!isUserAuthorized]]">
                    <paper-button id="login" on-tap="_login">[[i18n('Login')]]</paper-button>
                </template>
            </div>

            <paper-progress id="progress" indeterminate disabled></paper-progress>

            <div class="buttons">
                <paper-button noink dialog-dismiss on-tap="_close">Close</paper-button>
                <template is="dom-if" if="[[isUserAuthorized]]">
                    <paper-button id="action" on-tap="_do">[[_getActionLabel(document)]]</paper-button>
                </template>
            </div>
        </nuxeo-dialog>

    </template>

    <script>
        Polymer({
            is: 'nuxeo-wistia-publish',
            behaviors: [Nuxeo.LayoutBehavior, Nuxeo.MediaPublishBehavior],
            properties: {
                label: {
                    type: String,
                    value: 'Action Label'
                },
                showLabel: {
                    type: Boolean,
                    value: false,
                },
                icon: {
                    type: String,
                    value: 'iconset_name:icon_name'
                },
                document: {
                    type: Object,
                    observer: "_documentChanged"
                },
                providerId: {
                    value: 'wistia'
                },
                projects: {
                    type: Array,
                    value: function () { return []; }
                },
            },

            ready: function () {
                this.updateProviderInfo().then(() => {
                    if (this.isUserAuthorized) {
                        // If user is already authorized, we need to get the access token
                        // and fetch projects
                        this.$.oauth2.path = `oauth2/provider/${this.providerId}/token`;
                        return this.$.oauth2.get().then((response) => {
                            this.accessToken = response.token;
                            this._getProjects();
                        });
                    }
                }).catch((error) => {
                    console.warn('User is not authorized for Wistia or error occurred:', error);
                });
            },

            _toggleDialog: function () {
                this.$.dialog.toggle();
            },

            _login: function () {
                // Create Wistia authorization URL with proper parameters
                const authUrl = 'https://api.wistia.com/oauth/authorize?' +
                    'client_id=' + encodeURIComponent(this.clientId) +
                    '&redirect_uri=' + encodeURIComponent(this.redirectUri) +
                    '&response_type=code' +
                    '&scope=all:all';

                this.openPopup(authUrl, {
                    onMessageReceive: this._parseMessage.bind(this),
                    onClose: this._onOAuthPopupClose.bind(this),
                });
            },

            _parseMessage(event) {
                try {
                    const data = JSON.parse(event.data);

                    // Handle authorization code from popup
                    if (data.code) {
                        this._getAccessToken(data.code);
                    } else if (data.error) {
                        console.error('Authentication error:', data.error_description || data.error);
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            },

            _getAccessToken(code) {
                // Exchange authorization code for access token using form data
                const formData = new URLSearchParams();
                formData.append('client_id', this.clientId);
                formData.append('client_secret', this.clientSecret);
                formData.append('grant_type', 'authorization_code');
                formData.append('code', code);
                formData.append('redirect_uri', this.redirectUri);

                this.$.oauth2.path = '/oauth/token';
                this.$.oauth2.method = 'POST';
                this.$.oauth2.url = 'https://api.wistia.com/oauth/token';
                this.$.oauth2.body = formData.toString();

                this.$.oauth2.headers = {
                    'Content-Type': 'application/x-www-form-urlencoded'
                };

                this.$.oauth2.execute()
                    .then((response) => {
                        this.accessToken = response.access_token;
                        this.refreshToken = response.refresh_token;
                        this._handleAuthResult(this.accessToken);
                    })
                    .catch((error) => {
                        console.error('Error getting access token:', error);
                    });
            },

            _handleAuthResult(token) {
                if (token) {
                    // Store token and update UI
                    this.isUserAuthorized = true;
                    this.updateProviderInfo();

                    // Store token in provider info for future API calls
                    if (!this.provider) {
                        this.provider = {};
                    }
                    this.provider.token = token;

                    // Fetch projects now that we have a valid token
                    this._getProjects();
                } else {
                    this.isUserAuthorized = false;
                }
            },

            _onOAuthPopupClose() { },

            _getActionLabel: function (document) {
                return !this.isWistiaPublish(document) ? this.i18n('label.action.publish') : this.i18n('label.action.unpublish');
            },

            _documentChanged: function (document) {
                if (document) {
                    this.options.name = document.properties['dc:title']
                    this.options.description = document.properties['dc:description']
                }
            },

            _do: function () {
                if (!this.isWistiaPublish(this.document)) {
                    this._publish();
                } else {
                    this._unpublish();
                }
            },

            _getProjects: function () {
                // Check if we have an access token before making the API call
                if (!this.accessToken) {
                    console.warn('No access token available for fetching Wistia projects');
                    this.projects = [];
                    return;
                }

                fetch("https://api.wistia.com/v1/projects.json?sort_by=created&sort_direction=0", {
                    headers: {
                        'Authorization': 'Bearer ' + this.accessToken
                    }
                }).then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok: ' + response.statusText);
                    }
                    return response.json();
                }).then(data => {
                    this.projects = data.map(project => ({
                        label: project.name,
                        id: project.hashedId
                    }));
                    // Set default project if projects exist
                    if (this.projects.length > 0 && !this.options.project_id) {
                        this.options.project_id = this.projects[0].id;
                    }
                }).catch(error => {
                    console.error('Error fetching Wistia projects:', error);
                    this.projects = [];
                });
            },

            _getWistiaMediaId: function (document) {
                return document.properties['pm:providers'].find(element => element.provider === "wistia").externalId;
            },

            isWistiaPublish: function (document) {
                return document && document.properties && document.properties['pm:providers'] && document.properties['pm:providers'].findIndex(element => element.provider === "wistia") >= 0;
            }


        });
    </script>
</dom-module>
